<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>記憶の森と忘却の館</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="screen" width="320" height="240"></canvas>

    <div id="title">
      <h1 id="t-title">記憶の森と忘却の館</h1>
      <p id="t-sub">Bienvenue à la maison</p>
      <div class="lang">
        <button id="lang-ja" class="on">日本語</button>
        <button id="lang-en">English</button>
      </div>
      <div class="heroes"><span id="t-hero">主人公</span>
        <button id="hero-boy" class="on"><img src="assets/boy_face_0.png" alt="boy"></button>
        <button id="hero-girl"><img src="assets/girl_face_0.png" alt="girl"></button>
      </div>
      <label id="t-label" for="name">なまえ</label>
      <input id="name" maxlength="8" value="">
      <button id="start">はじめる</button>
    </div>

    <div id="msg" hidden><img id="face" alt="" hidden><span id="msgtext"></span></div>
    <div id="help" hidden></div>
    <div id="inv" hidden></div>
  </div>
  <div id="touch" hidden>
    <div id="dpad"><button data-k="ArrowUp">▲</button><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button><button data-k="ArrowDown">▼</button></div>
    <div id="abtns"><button id="b-act"></button><div><button id="b-back"></button><button id="b-menu"></button></div></div>
  </div>
  <script src="game.js"></script>
  <script src="game2.js"></script>
  <script src="game3.js"></script>
  <script src="game4.js"></script>
  <script src="game5.js"></script>
  <script src="game6.js"></script>
  <script src="game7.js"></script>
  <script src="game8.js"></script>
  <script src="game9.js"></script>
  <script src="game10.js"></script>
  <script src="game11.js"></script>
  <script src="game12.js"></script>
</body>
</html>
